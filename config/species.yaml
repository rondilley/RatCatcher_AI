# RatCatcher AI -- Western US Bird Feeder Species Taxonomy
#
# Each species has:
#   genus_species: Binomial name (current taxonomy)
#   common_name: Common English name
#   family: Taxonomic family
#   label_index: Model output class index in the iNaturalist bird model
#                (mobilenet_v2_inat_bird_quant.tflite, 965 classes)
#
# Model uses older genus names for some woodpeckers (Picoides vs Dryobates).
# We use current taxonomy here; the label_index handles the mapping.
#
# Pest species have a 'category' field used by the YOLO detection stage.

