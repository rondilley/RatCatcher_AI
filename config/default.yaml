# RatCatcher AI -- Default Configuration
#
# Override config directory via RATCATCHER_CONFIG_DIR environment variable.
# Individual values can be overridden by placing a local.yaml in the same
# directory (merged on top of this file).

system:
  data_dir: "data"
  log_level: "INFO"
  # Set to "rpi", "windows", or "auto" (auto-detect)
  platform: "auto"

cameras:
  - id: 0
    enabled: true
    # "picamera", "webcam", or "file"
    source_type: "auto"
    # Must match the aspect ratio of `capture_resolution` below. The
    # camera loop resizes one to the other, and a resize squashes rather
    # than crops, so 16:9 here against the sensor's 4:3 compressed every
    # animal vertically by a third -- in the clips and in the crop the
    # species classifier reads. 1440x1080 loses no field of view and is
    # 4.45 MB a frame against 5.93, which the pre-event ring buffers pay
    # 70 times per camera.
    resolution: [1440, 1080]
    # Sensor readout size. The detector needs native-resolution pixels to
    # see a small animal: squeezing a whole 1920x1080 frame into the
    # model's 640x640 input leaves a House Finch about 17 px tall, well
    # under the ~100 px where recall collapses. Reading out the full
    # 4056x3040 sensor and cutting a 640x640 window instead leaves the
    # same bird at about 62 px. Costs frame rate -- 14 fps is the sensor
    # maximum at full resolution -- and the frame never travels further
    # than the camera loop, which downscales to `resolution` above.
    capture_resolution: [4056, 3040]
    fps: 14
    # For file source: path to video file or image directory
    file_path: null
    # For webcam source: device index
    device_index: 0
    # Region of interest (polygon vertices as [x, y] pairs, normalized 0-1)
    # Empty list means full frame
    roi: []

  - id: 1
    enabled: true
    source_type: "auto"
    # 4:3 to match capture_resolution -- see camera 0.
    resolution: [1440, 1080]
    capture_resolution: [4056, 3040]
    fps: 14
    file_path: null
    device_index: 1
    roi: []

motion:
  enabled: true
  # MOG2 parameters
  history: 500
  var_threshold: 16
  detect_shadows: false
  # Processing resolution (independent of camera resolution).
  # 640x480 rather than 320x240 because the targets are small.  At
  # 4056x3040 capture a House Finch is about 62 px tall and a squirrel
  # about 110 px (the sizing under "Why the detector sees a window, not
  # the frame"), which at 320x240 becomes about 5 px and 9 px.  A 5 px
  # blob does not survive the 3x3 erosion below, so the bird was erased
  # before the area filter ever saw it.  At 640x480 the same bird is
  # about 10 px and comes through.
  process_width: 640
  process_height: 480
  # Morphological cleanup
  erode_kernel: 3
  dilate_kernel: 7
  # Minimum contour area as a fraction of frame area.  This is the floor
  # that decides which animals exist at all: motion runs before the ROI
  # windows are planned, so a region rejected here never reaches the
  # detector.  The old 0.005 meant 384 px2 at 320x240, which back-scales
  # to a 248x248 px object at sensor resolution -- bigger than a cat, so
  # no bird and no squirrel could ever pass it, and the detections table
  # held zero rows for the life of the database.  0.0002 is 61 px2 at
  # 640x480, and a finch presents about 154 px2 after the dilation above,
  # so it clears with roughly 2.5x margin.
  min_area_pct: 0.0002
  # Maximum contour area as a fraction of frame area. A cloud crossing the
  # sun, or an auto-exposure step, changes every pixel at once and MOG2
  # reports it as a single region covering ~99% of the frame. Measured on
  # this Pi that was the ONLY motion the cameras produced in 680 frames,
  # and it would drive the ROI-crop window back to the whole frame.
  max_area_pct: 0.5
  # Seconds to suppress repeated detections in the same region
  cooldown_seconds: 2.0
  # MOG2 learning rate (-1 for auto)
  learning_rate: -1

detection:
  enabled: true
  # "auto", "hailo", "ncnn", or "opencv_dnn"
  backend: "auto"
  # Path to model file (relative to models/ directory).
  #
  # One setting covers every backend: the factory swaps the suffix for
  # ".hef" on the Hailo path and keeps the ".onnx" for the OpenCV DNN
  # fallback, so both look for the same model by stem.
  #
  # This must name the CUSTOM model, not stock yolov8n. Stock is COCO-80,
  # which has no squirrel and no rat class -- on it the detector can only
  # ever report bird and cat, which defeats the point of the project.
  # Until models/ratcatcher_best.hef is compiled (see scripts/build_hef.sh,
  # which needs an x86 machine), "auto" falls back to the ONNX on the CPU:
  # slower, but it can actually see a pest.
  model_path: "ratcatcher_best.onnx"
  # Minimum confidence to report a detection
  confidence_threshold: 0.45
  # Non-maximum suppression IoU threshold
  nms_threshold: 0.45
  # Run the detector on native-resolution windows cut around motion rather
  # than on the whole frame stretched to the model input. Measured on 100
  # labelled crops composited into a live frame from this Pi:
  #   full frame -> ROI at sensor res:
  #   House Finch  0/100 -> 38/100
  #   Squirrel     1/100 -> 55/100
  #   Cat          2/100 -> 78/100
  # Needs capture_resolution above; on its own it recovers pests but not
  # birds (finch reaches only 1/100 without the extra sensor detail).
  roi_crop: true
  # Window edge in capture pixels. Matching input_size means the detector
  # rescales nothing at all.
  roi_crop_window: 640
  # Windows per frame. Each one costs a full inference.
  roi_crop_max_windows: 2
  # Model input size
  input_size: [640, 640]

classification:
  enabled: true
  # Path to TFLite model (relative to models/ directory)
  # Default: Google iNaturalist MobileNet V2, INT8 quantized, 965 bird species
  model_path: "mobilenet_v2_inat_bird_quant.tflite"
  # Path to species taxonomy YAML
  species_config: "species.yaml"
  # Model input size (224x224 for MobileNet V2)
  input_size: [224, 224]
  # Number of top predictions to return
  top_k: 5
  # Minimum confidence to accept a species prediction
  min_confidence: 0.70
  # Use XNNPACK delegate for CPU acceleration
  use_xnnpack: true

storage:
  # SQLite database path (relative to data_dir)
  db_path: "detections.db"
  # Video clip output directory (relative to data_dir)
  clip_dir: "clips"
  # Thumbnail output directory (relative to data_dir)
  thumbnail_dir: "thumbnails"
  # Seconds of video to keep before the detection event
  clip_pre_seconds: 5
  # Seconds of video to keep after the detection event
  clip_post_seconds: 10
  # Delete clips older than this many days (0 = never delete)
  retention_days: 30
  # Maximum total disk usage in GB for clips + thumbnails (0 = unlimited)
  max_disk_gb: 10
  # FFmpeg encoding preset (ultrafast, fast, medium)
  ffmpeg_preset: "fast"

audio:
  # Dual Adafruit SPH0645 I2S MEMS microphones for bird song detection.
  #
  # Both mics share one I2S bus and are separated by their SEL pin, so the
  # OS presents them as ONE stereo capture device: channel 0 is the left
  # mic (SEL to GND), channel 1 the right (SEL to 3.3V). This requires
  # sudo ./scripts/enable_i2s_mics.sh followed by a reboot; without the
  # overlay there is no capture device and the audio engine reports the
  # failure and stands down, leaving the cameras running.
  enabled: true

  # "auto" (alsa, falling back to file), "alsa", or "file"
  source_type: "auto"
  # ALSA device name; "default" follows the system default card
  device: "default"
  sample_rate: 48000
  channels: 2
  # Seconds of audio read from the device per block
  block_seconds: 0.5
  # For file source: WAV path used for development and testing
  file_path: null
  file_loop: false

  # High-pass corner removing the SPH0645 DC offset and wind rumble.
  # Well below the fundamental of any North American songbird.
  highpass_hz: 150.0

  # Activity gate: the audio equivalent of the motion pre-filter. Keeps
  # BirdNET inference off windows containing only silence or noise.
  gate_enabled: true
  gate_band_low_hz: 1000.0
  gate_band_high_hz: 10000.0
  # How far above the tracked ambient noise floor a sound must rise.
  # Measured against a field soundscape with BirdNET as ground truth:
  # 2 dB keeps 100% of windows containing a real bird, 4 dB loses 14%,
  # 6 dB loses 48%. In a dawn chorus the birds ARE the ambient sound, so
  # a large margin rejects the subject. The gate still turns away silence
  # and steady rain, which is where it actually saves work.
  gate_snr_margin_db: 2.0
  # Hard floor guarding against triggering on digital silence
  gate_absolute_floor_dbfs: -85.0
  # Maximum spectral flatness: 0 is a pure tone, 1 is white noise.
  # Song is tonal and measures 0.01-0.06 in the field; rain scores high.
  gate_max_flatness: 0.6
  # Seconds to suppress repeated detections on the same channel
  cooldown_seconds: 3.0

  # BirdNET model. Weights are CC BY-NC-SA and are NOT in this repo;
  # fetch them with ./scripts/download_models.sh
  model_path: "BirdNET_v2.4_audio-model.tflite"
  labels_path: "BirdNET_v2.4_labels_en_us.txt"
  min_confidence: 0.25
  top_k: 3
  # Interpreter threads. The Pi 5 has 4 cores and the camera pipeline
  # needs them too, so 2 leaves headroom.
  num_threads: 2
  # Identify each mic separately (costs one inference per mic, but tells
  # you which side of the feeder the bird was on) or average to mono.
  per_channel: true

  # Save a WAV clip alongside each identification
  save_clips: true
  clip_dir: "audio"

display:
  # Elecrow CrowPanel ESP32 2.13-inch e-paper status panel over USB.
  #
  # The panel shows what was detected in the counting window, split into
  # what the cameras saw and what the microphones heard, plus the health
  # of the system itself. It is an output only: nothing in the pipeline
  # reads from it, so it can be unplugged at any time.
  #
  # It needs the RatCatcher firmware. The board ships with an Elecrow
  # demo that ignores the serial port. Flash it with:
  #   ./scripts/build_panel_firmware.sh --port /dev/ttyUSB0 --upload
  #
  # Safe to leave on with no panel attached: source_type "auto" falls
  # back to a null panel, which the pipeline drives and discards.
  enabled: true

  # "auto" (serial, falling back to no panel), "serial", "file", "null"
  source_type: "auto"

  # Serial device path, or "auto" to find it.
  #
  # "auto" opens every port carrying a known USB serial bridge, sends an
  # identification request, and keeps the one whose panel answers. The
  # handshake is needed because the CrowPanel presents a plain CH340
  # descriptor, identical to that of any other cheap board, so the USB
  # identifiers alone cannot tell them apart. Name the port here if the
  # machine carries serial devices that must not be opened.
  port: "auto"
  baud_rate: 115200
  # Must exceed the ESP32 boot time: opening the port resets the
  # panel, and its hello arrives about 2.4 s later. See
  # RESET_SETTLE_SECONDS in src/ratcatcher/display/factory.py.
  probe_seconds: 6.0
  reconnect_seconds: 10.0

  # For file source: encoded frames are appended here instead of being
  # sent to a panel. Used for development with no hardware attached.
  file_path: null

  # Counting window: "today" (since local midnight), "24h", or "all"
  window: "today"

  # Seconds between readings. A reading identical to the one already on
  # the panel is not sent, so this is an upper bound on how often the
  # panel is written to, not a fixed refresh rate.
  refresh_seconds: 30.0

  # Redraw at least this often even when nothing has changed. Without
  # it, a host that has died leaves a screen that still reads RUN.
  heartbeat_seconds: 300.0

  # Partial refresh is fast and quiet but leaves a ghost of the previous
  # image behind, and the ghosts build up. Clear them with a full
  # refresh every this many frames.
  full_refresh_every: 15

alerts:
  enabled: false
  # Alert on these detection classes
  alert_classes: ["squirrel", "rat", "cat", "unknown_animal"]
  # Minimum seconds between alerts for the same class
  cooldown_seconds: 300
  # Alert methods (future: email, mqtt, webhook)
  methods: []

syslog:
  # Detection and status reporting to syslog.
  #
  # Two kinds of line are sent, both in logfmt (key=value), so a log
  # aggregator can extract fields without a regex per message shape:
  #
  #   detection modality=video camera=0 class=squirrel confidence=0.87
  #   status window=today bird_seen=12 bird_heard=31 cameras=2 npu=yes
  #
  # Nothing else goes to syslog. libcamera's pixel format warnings and
  # picamera2's startup chatter stay in journald, because a forwarded
  # stream is the one view of this system an operator has when the Pi
  # itself is out of reach, and it is worth keeping narrow.
  #
  # Turning this off silences the socket, not the record: the lines
  # still reach journald, where they were not visible before.
  enabled: true

  # A path is a local syslog socket. "host:port" is a remote loghost;
  # a bare hostname is rejected rather than given a default port, so a
  # typo cannot quietly ship detections somewhere unintended.
  address: "/dev/log"
  # Transport for a remote loghost. Ignored for a socket path.
  protocol: "udp"
  # local0 rather than daemon: this is application output, and keeping
  # it off daemon lets rsyslog route feeder detections into their own
  # file without catching every other service on the Pi.
  facility: "local0"
  # The tag the lines carry, which is what "journalctl -t" matches.
  ident: "ratcatcher"

  # One line per stored detection.
  detections: true

  # Seconds between status lines. Far longer than the panel's refresh:
  # the panel redraws to stay readable at a glance, while this exists to
  # prove the system is alive and carry counts, and one line every five
  # minutes does that without filling a loghost with a record that
  # barely changes.
  status_interval_seconds: 300
  # Counting window: "today" (since local midnight), "24h", or "all".
  # Matches display.window above so the panel and the log agree.
  status_window: "today"

monitoring:
  # System health check interval in seconds
  health_interval_seconds: 60
  # How often the pipeline logs its own counters: frames captured, motion
  # events, ROI windows cut, detections, and what was stored or dropped.
  # This is the line that says which stage a frame died at -- motion
  # firing with no crops means the ROI path is off, crops with no
  # detections means the model or the lens.  Set to 0 to disable.
  pipeline_stats_interval_seconds: 300
  # CPU temperature warning threshold (Celsius)
  temp_warning_c: 75
  # CPU temperature critical threshold (Celsius)
  temp_critical_c: 82

# Battery telemetry from the Waveshare UPS HAT (E).
#
# The HAT presents an MCU at I2C 0x2d that bridges a BQ4050 fuel gauge
# and an IP2368 charger.  Reading it is read-only by construction: the
# two destructive registers in its map -- 0x01, which powers the board
# off, and 0x41, which reassigns the I2C address -- have no write path
# in this codebase at all.
battery:
  # Reading the HAT needs only the I2C bus, which every Raspberry Pi OS
  # install has, so this is on by default like syslog rather than off
  # like the panel.  A machine with no HAT fitted reports nothing.
  enabled: true
  i2c_bus: 1
  i2c_address: 0x2d
  # Bounds how long the system can be running from the pack before
  # anything notices.  This is the interval that matters when mains
  # fails.
  poll_interval_seconds: 60
  # How often a row is written to battery_samples.  Storing every poll
  # would be 1440 rows a day to answer a question asked in weeks.  A
  # change of power source is stored at once whatever this says.
  sample_interval_seconds: 300
  # Charge below which the status line and the panel report a warning.
  warn_percent: 40
  # Halt the system cleanly while there is still charge left to do it
  # with.  OFF BY DEFAULT: the config files are dpkg conffiles, so an
  # upgrade that keeps its own copy falls back to these defaults, and
  # acquiring the power to halt the machine is not something an upgrade
  # should do without being asked.
  #
  # The pack measures 4792 mAh at 16.4 V (about 78 Wh) against a load
  # measured at 10-14 W, so a full charge is roughly 5-7 hours and 15%
  # is something like 45 minutes of margin.
  shutdown_enabled: false
  shutdown_percent: 15
  # Either floor fires.  Percent survives a gauge with nothing to
  # estimate from; minutes responds to an unusually heavy load, and is
  # the gauge's own estimate rather than one computed here.
  shutdown_minutes: 10
