[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratcatcher"
version = "0.1.0"
description = "Wildlife detection system for bird feeders using neural networks on Raspberry Pi 5"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
rpi = [
    "picamera2>=0.3.17",
]
audio = [
    # TFLite interpreter for BirdNET song identification and for the
    # visual species classifier. tflite-runtime publishes no wheels for
    # Python 3.13, which is what current Raspberry Pi OS ships;
    # ai-edge-litert is its maintained successor and does.
    "ai-edge-litert>=1.0",
]
display = [
    # Serial link to the Elecrow CrowPanel e-paper status panel.
    "pyserial>=3.5",
]
dev = [
    "pytest>=7.0",
    "pyserial>=3.5",
]
cpu = [
    "ncnn>=1.0.20230816",
]

[project.scripts]
ratcatcher = "ratcatcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
